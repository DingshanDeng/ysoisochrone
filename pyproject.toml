[build-system]
requires = ["setuptools >= 61.0"]

[project]
name = "ysoisochrone"
version = "1.2.0"
authors = [
  { name="Dingshan Deng", email="dingshandeng@arizona.edu" },
]
description = "Python package handles the young-stellar-objects isochrones, and one primary goal is to derive the stellar mass and ages from the isochrones."
dependencies = [
  "numpy",
  "pandas",
  "matplotlib>=3.3.4",
  "scipy",
  "requests",
  "tqdm",
  "jupyter",
  "pytest",
]
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = {file = "LICEN[CS]E*"}
# license = { text = "MIT" }
# license-files = ["LICENSE", "LICENCE", "COPYING", "NOTICE", "LICENSE.*", "LICENCE.*"]

[project.urls]
Homepage = "https://github.com/DingshanDeng/ysoisochrone"
Issues = "https://github.com/DingshanDeng/ysoisochrone/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"ysoisochrone" = ["data/*.mat"]

[tool.setuptools.packages.find]
include = ["ysoisochrone*"]
exclude = ["paper*", "tutorial_notebooks*"]

[tool.ruff]
target-version = "py38"
line-length = 120  # informational: E501 is not in the selected rule set below
extend-exclude = ["docs", "tutorial_notebooks", "paper"]

[tool.ruff.lint]
# Pin the rule set to ruff's historical default (E4/E7/E9/F), which the codebase
# already satisfies. Recent ruff releases expanded their built-in defaults
# (I, UP, SIM, B, PL, RUF, ...), and with an unpinned `pip install ruff` in CI
# that silently turned ~80 new findings into a lint failure on unchanged code.
# Adopting any of those rule groups is a separate, deliberate cleanup.
select = ["E4", "E7", "E9", "F"]
